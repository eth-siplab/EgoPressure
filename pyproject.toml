[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "egopressure"
version = "0.1.0"
description = "Toolkit for the EgoPressure dataset — egocentric hand pressure & pose (CVPR 2025): loading, partial download, geometry, visualization"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ETH Zurich SIPLAB" }]
keywords = ["dataset", "hand-pose", "pressure", "egocentric", "MANO", "CVPR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pillow>=9",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
notebook = ["matplotlib>=3.5", "ipywidgets>=8"]
torch = ["torch>=2.0"]
all = ["matplotlib>=3.5", "ipywidgets>=8", "torch>=2.0"]

[project.urls]
Dataset = "https://huggingface.co/datasets/eth-siplab/EgoPressure"
Homepage = "https://siplab.org/projects/EgoPressure"
Paper = "https://arxiv.org/abs/2409.02224"
Repository = "https://github.com/eth-siplab/EgoPressure"

[project.scripts]
egopressure = "egopressure.cli:main"

[tool.setuptools]
packages = ["egopressure"]

[tool.setuptools.package-data]
egopressure = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# notebooks import next to the concepts they demonstrate
"*.ipynb" = ["E402", "I001"]
